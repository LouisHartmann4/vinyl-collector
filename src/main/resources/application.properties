spring.datasource.url=jdbc:h2:file:./data/vinylcollector
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8081}

discogs.token=${DISCOGS_TOKEN:nQCzDOVOBOKOxXkpNgAKCpNTmWCZpxOCUmGqqqhK}
discogs.user-agent=VinylCollector/1.0 +https://localhost

# Anmeldung: Session-Cookie nur für diese Seite, nicht von fremden Seiten mitgeschickt
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Session-ID nur im Cookie, nie als ;jsessionid=... in der Adresse
server.servlet.session.tracking-modes=cookie
# Eingaben werden an der API geprüft; alte Datensätze sollen Preis-Updates nicht blockieren
spring.jpa.properties.jakarta.persistence.validation.mode=none
